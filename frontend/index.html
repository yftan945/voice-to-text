<html lang="zh-Hant-TW">

    <script>
      // 手動選的外觀在第一次繪製前套用，避免閃一下系統色
      try {
        var t = localStorage.getItem("v2t.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
